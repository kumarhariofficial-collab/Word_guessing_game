<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXICON — Word Guessing Game</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ── CSS Variables ── */
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a28;
  --border: #2a2a40;
  --accent: #00f5c4;
  --accent2: #ff2d78;
  --accent3: #ffd700;
  --accent4: #a855f7;
  --text: #e8e8f0;
  --text-dim: #6b6b8a;
  --glow: 0 0 20px rgba(0,245,196,0.4);
  --glow-red: 0 0 20px rgba(255,45,120,0.4);
  --glow-gold: 0 0 20px rgba(255,215,0,0.4);
  --radius: 12px;
  --font-display: 'Orbitron', monospace;
  --font-body: 'Space Mono', monospace;
}
[data-theme="light"] {
  --bg: #f0f0f8;
  --surface: #ffffff;
  --surface2: #e8e8f5;
  --border: #c0c0d8;
  --text: #1a1a2e;
  --text-dim: #6b6b8a;
}

/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.4s, color 0.4s;
}

/* ── Background Grid ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,245,196,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,196,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;
  z-index:0;
}
[data-theme="light"] body::before{
  background-image:
    linear-gradient(rgba(0,150,120,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,150,120,0.06) 1px, transparent 1px);
}

/* ── Layout ── */
.container{
  position:relative;z-index:1;
  max-width:900px;
  margin:0 auto;
  padding:20px 16px 60px;
}

/* ── Header ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 30px;
  border-bottom:1px solid var(--border);
  margin-bottom:30px;
}
.logo{
  font-family:var(--font-display);
  font-size:clamp(1.4rem,4vw,2rem);
  font-weight:900;
  letter-spacing:0.15em;
  color:var(--accent);
  text-shadow: var(--glow);
}
.logo span{color:var(--accent2);}
.header-controls{display:flex;gap:10px;align-items:center;}
.icon-btn{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  width:40px;height:40px;
  border-radius:8px;
  cursor:pointer;
  font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow);}

/* ── Score Bar ── */
.score-bar{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;margin-bottom:28px;
}
.score-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  text-align:center;
  transition:border-color 0.3s;
}
.score-card:hover{border-color:var(--accent);}
.score-label{font-size:0.6rem;letter-spacing:0.2em;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;}
.score-value{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--accent);}
.score-card.best .score-value{color:var(--accent3);}
.score-card.streak .score-value{color:var(--accent2);}

/* ── Game Setup Panel ── */
.setup-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  margin-bottom:24px;
  display:flex;flex-wrap:wrap;gap:20px;align-items:center;
}
.setup-group{display:flex;flex-direction:column;gap:8px;}
.setup-label{font-size:0.65rem;letter-spacing:0.2em;color:var(--text-dim);text-transform:uppercase;}
.pill-group{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text-dim);
  padding:6px 16px;
  border-radius:999px;
  cursor:pointer;
  font-family:var(--font-body);
  font-size:0.75rem;
  letter-spacing:0.05em;
  transition:all 0.2s;
}
.pill:hover,.pill.active{
  background:var(--accent);color:#000;
  border-color:var(--accent);
  box-shadow:var(--glow);
}
.pill.diff-medium.active{background:var(--accent3);border-color:var(--accent3);box-shadow:var(--glow-gold);}
.pill.diff-hard.active{background:var(--accent2);border-color:var(--accent2);box-shadow:var(--glow-red);}

/* ── Timer Bar ── */
.timer-wrap{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 20px;
  margin-bottom:24px;
  display:flex;align-items:center;gap:16px;
}
.timer-icon{font-size:1.3rem;}
.timer-track{flex:1;height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;}
.timer-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--accent4));
  border-radius:999px;
  transition:width 1s linear, background 0.5s;
}
.timer-fill.warning{background:linear-gradient(90deg,var(--accent3),var(--accent2));}
.timer-count{font-family:var(--font-display);font-size:1.1rem;min-width:40px;text-align:right;}

/* ── Word Display ── */
.word-area{text-align:center;margin-bottom:32px;padding:32px 20px;}
.category-badge{
  display:inline-block;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:999px;padding:4px 14px;
  font-size:0.65rem;letter-spacing:0.2em;color:var(--text-dim);
  text-transform:uppercase;margin-bottom:20px;
}
.word-display{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;
  min-height:80px;
}
.letter-box{
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.letter-char{
  font-family:var(--font-display);
  font-size:clamp(1.8rem,5vw,2.8rem);
  font-weight:900;
  min-width:clamp(28px,5vw,48px);
  height:clamp(40px,8vw,64px);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
  text-transform:uppercase;
  transition:all 0.3s;
}
.letter-char.blank{color:transparent;}
.letter-char.reveal{
  animation:letterReveal 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes letterReveal{
  from{transform:scale(0) rotateX(90deg);opacity:0;}
  to{transform:scale(1) rotateX(0);opacity:1;}
}
.letter-line{
  width:clamp(28px,5vw,48px);
  height:3px;
  border-radius:2px;
  background:var(--border);
  transition:background 0.3s;
}
.letter-box.active .letter-line{background:var(--accent);}
.hint-text{
  margin-top:16px;font-size:0.8rem;color:var(--text-dim);
  font-style:italic;min-height:24px;
}

/* ── Lives / Hangman ── */
.lives-row{
  display:flex;gap:8px;justify-content:center;margin-bottom:28px;
}
.heart{
  font-size:1.4rem;
  transition:all 0.3s;
  filter:drop-shadow(0 0 6px rgba(255,45,120,0.6));
}
.heart.lost{
  filter:grayscale(1) opacity(0.3);
  animation:heartLost 0.5s ease;
}
@keyframes heartLost{
  0%{transform:scale(1.3);}50%{transform:scale(0.7);}100%{transform:scale(1);}
}

/* ── Keyboard ── */
.keyboard{margin-bottom:28px;}
.kb-row{display:flex;gap:6px;justify-content:center;margin-bottom:6px;flex-wrap:wrap;}
.kb-key{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--font-display);
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.05em;
  min-width:38px;height:44px;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.15s;
  text-transform:uppercase;
}
.kb-key:hover:not(:disabled){
  background:var(--accent);color:#000;
  border-color:var(--accent);
  box-shadow:var(--glow);
  transform:translateY(-2px);
}
.kb-key.correct{
  background:var(--accent);color:#000;
  border-color:var(--accent);
  opacity:0.7;cursor:default;
}
.kb-key.wrong{
  background:var(--surface);color:var(--text-dim);
  border-color:var(--border);
  opacity:0.4;cursor:default;
  text-decoration:line-through;
}
.kb-key:disabled{cursor:default;}

/* ── Action Buttons ── */
.action-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px;}
.btn{
  font-family:var(--font-display);
  font-size:0.7rem;
  font-weight:700;
  letter-spacing:0.1em;
  padding:12px 24px;
  border-radius:var(--radius);
  border:none;cursor:pointer;
  transition:all 0.2s;
  text-transform:uppercase;
}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{box-shadow:var(--glow);transform:translateY(-2px);}
.btn-danger{background:var(--accent2);color:#fff;}
.btn-danger:hover{box-shadow:var(--glow-red);transform:translateY(-2px);}
.btn-ghost{
  background:transparent;color:var(--text);
  border:1px solid var(--border);
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow);}
.btn:disabled{opacity:0.4;cursor:default;transform:none !important;box-shadow:none !important;}

/* ── Message Toast ── */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:var(--surface);border:1px solid var(--accent);
  color:var(--text);padding:14px 28px;border-radius:var(--radius);
  font-family:var(--font-display);font-size:0.8rem;letter-spacing:0.1em;
  box-shadow:var(--glow);
  transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);
  z-index:1000;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.error{border-color:var(--accent2);box-shadow:var(--glow-red);}
.toast.success{border-color:var(--accent3);box-shadow:var(--glow-gold);}

/* ── Win/Lose Overlay ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(10,10,15,0.92);
  display:flex;align-items:center;justify-content:center;
  z-index:500;
  opacity:0;pointer-events:none;
  transition:opacity 0.4s;
  backdrop-filter:blur(8px);
}
.overlay.show{opacity:1;pointer-events:all;}
.overlay-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:48px 40px;
  text-align:center;
  max-width:480px;width:90%;
  transform:scale(0.8);
  transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);
}
.overlay.show .overlay-card{transform:scale(1);}
.overlay-emoji{font-size:5rem;margin-bottom:16px;display:block;}
.overlay-title{
  font-family:var(--font-display);
  font-size:2rem;font-weight:900;
  letter-spacing:0.1em;margin-bottom:8px;
}
.overlay-title.win{color:var(--accent3);text-shadow:var(--glow-gold);}
.overlay-title.lose{color:var(--accent2);text-shadow:var(--glow-red);}
.overlay-word{
  font-size:0.85rem;color:var(--text-dim);margin-bottom:8px;
}
.overlay-word strong{color:var(--accent);font-size:1.2rem;text-transform:uppercase;}
.overlay-points{
  font-family:var(--font-display);font-size:1.4rem;
  color:var(--accent3);margin:20px 0;
}
.overlay-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px;}

/* ── Leaderboard ── */
.leaderboard{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:24px;
}
.lb-title{
  font-family:var(--font-display);font-size:0.75rem;font-weight:700;
  letter-spacing:0.2em;color:var(--text-dim);text-transform:uppercase;
  margin-bottom:16px;display:flex;align-items:center;gap:8px;
}
.lb-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
  font-size:0.8rem;
}
.lb-row:last-child{border-bottom:none;}
.lb-rank{
  font-family:var(--font-display);font-size:0.7rem;font-weight:700;
  color:var(--text-dim);min-width:24px;
}
.lb-rank.gold{color:var(--accent3);}
.lb-rank.silver{color:#c0c0c0;}
.lb-rank.bronze{color:#cd7f32;}
.lb-name{flex:1;color:var(--text);}
.lb-score{font-family:var(--font-display);color:var(--accent);}
.lb-diff{font-size:0.65rem;color:var(--text-dim);}
.no-scores{color:var(--text-dim);font-size:0.8rem;text-align:center;padding:16px;}

/* ── Confetti Canvas ── */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:600;}

/* ── Shake Animation ── */
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}
.shake{animation:shake 0.5s ease;}

/* ── Pulse ── */
@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:0.4;}
}
.pulse{animation:pulse 1s ease infinite;}

/* ── Responsive ── */
@media(max-width:600px){
  .setup-panel{flex-direction:column;}
  .score-bar{grid-template-columns:repeat(3,1fr);}
  .overlay-card{padding:32px 24px;}
  .overlay-title{font-size:1.5rem;}
  .kb-key{min-width:30px;height:38px;font-size:0.6rem;}
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="toast" id="toast"></div>

<!-- Win/Lose Overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <span class="overlay-emoji" id="overlayEmoji"></span>
    <div class="overlay-title" id="overlayTitle"></div>
    <div class="overlay-word" id="overlayWord"></div>
    <div class="overlay-points" id="overlayPoints"></div>
    <div class="overlay-btns">
      <button class="btn btn-primary" onclick="newGame()">▶ Play Again</button>
      <button class="btn btn-ghost" onclick="closeOverlay()">✕ Close</button>
    </div>
  </div>
</div>

<div class="container">
  <header>
    <div class="logo">LEX<span>I</span>CON</div>
    <div class="header-controls">
      <button class="icon-btn" id="muteBtn" onclick="toggleMute()" title="Toggle Sound">🔊</button>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
      <button class="icon-btn" onclick="showLeaderboard()" title="Leaderboard">🏆</button>
    </div>
  </header>

  <!-- Score Bar -->
  <div class="score-bar">
    <div class="score-card">
      <div class="score-label">Score</div>
      <div class="score-value" id="scoreDisplay">0</div>
    </div>
    <div class="score-card best">
      <div class="score-label">Best</div>
      <div class="score-value" id="bestDisplay">0</div>
    </div>
    <div class="score-card streak">
      <div class="score-label">Streak</div>
      <div class="score-value" id="streakDisplay">0🔥</div>
    </div>
  </div>

  <!-- Setup Panel -->
  <div class="setup-panel">
    <div class="setup-group">
      <div class="setup-label">Difficulty</div>
      <div class="pill-group">
        <button class="pill diff-easy active" onclick="setDifficulty('easy',this)">Easy</button>
        <button class="pill diff-medium" onclick="setDifficulty('medium',this)">Medium</button>
        <button class="pill diff-hard" onclick="setDifficulty('hard',this)">Hard</button>
      </div>
    </div>
    <div class="setup-group">
      <div class="setup-label">Category</div>
      <div class="pill-group" id="catPills"></div>
    </div>
    <button class="btn btn-primary" onclick="newGame()">▶ New Word</button>
  </div>

  <!-- Timer -->
  <div class="timer-wrap">
    <span class="timer-icon">⏱</span>
    <div class="timer-track">
      <div class="timer-fill" id="timerFill"></div>
    </div>
    <div class="timer-count" id="timerCount">--</div>
  </div>

  <!-- Word Area -->
  <div class="word-area">
    <div class="category-badge" id="catBadge">Choose difficulty & press New Word</div>
    <div class="word-display" id="wordDisplay">
      <div style="color:var(--text-dim);font-size:0.9rem;padding:20px;">Press <strong style="color:var(--accent)">▶ New Word</strong> to begin</div>
    </div>
    <div class="hint-text" id="hintText"></div>
  </div>

  <!-- Lives -->
  <div class="lives-row" id="livesRow"></div>

  <!-- Keyboard -->
  <div class="keyboard" id="keyboard"></div>

  <!-- Actions -->
  <div class="action-row">
    <button class="btn btn-ghost" id="hintBtn" onclick="useHint()" disabled>💡 Hint (–50pts)</button>
    <button class="btn btn-ghost" id="skipBtn" onclick="skipWord()" disabled>⏭ Skip Word</button>
    <button class="btn btn-danger" id="giveUpBtn" onclick="giveUp()" disabled>🏳 Give Up</button>
  </div>

  <!-- Leaderboard -->
  <div class="leaderboard" id="leaderboardPanel">
    <div class="lb-title">🏆 High Scores</div>
    <div id="lbContent"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   WORD DATABASE
═══════════════════════════════════════════ */
const WORDS = {

    medium: ["cricket","tennis","hockey","skiing","rowing","boxing","judo","cycling","archery","surfing"],
    hard: ["badminton","volleyball","equestrian","gymnastics","weightlifting","skateboarding","bobsleigh","pentathlon","orienteering","trampoline"]
  },
  food: {
    easy: ["rice","cake","soup","taco","pizza","sushi","wrap","bun","pie","jam"],
    medium: ["pasta","burger","noodle","waffle","brisket","falafel","ceviche","samosa","tiramisu","hummus"],
    hard: ["bouillabaisse","chimichanga","ratatouille","wiener schnitzel","bibimbap","moussaka","goulash","paella","shakshuka","bruschetta"]
  }

const HINTS = {
  technology:{python:"Scripting language named after a snake",kernel:"Core of an operating system",blockchain:"Decentralized ledger technology",javascript:"Language of the web browser",algorithm:"Step-by-step problem-solving procedure",recursion:"A function that calls itself",encryption:"Scrambling data for security",router:"Directs network traffic",binary:"Base-2 number system",server:"Hosts and serves resources"},
  animals:{chameleon:"Changes its skin color",axolotl:"A salamander that never grows up",pangolin:"Covered in scales, rolls into a ball",platypus:"Mammal that lays eggs",narwhal:"The unicorn of the sea"},
  countries:{liechtenstein:"Europe's fourth-smallest country",kyrgyzstan:"Landlocked country in Central Asia",azerbaijan:"Country on the Caspian Sea"},
  movies:{inception:"A dream within a dream",parasite:"2019 Oscar Best Picture from South Korea",interstellar:"Wormholes and a black hole called Gargantua",shawshank:"Hope is a good thing"},
  sports:{pentathlon:"Five disciplines in one event",equestrian:"Horse-riding sport",bobsleigh:"Winter sport on an icy track"},
  food:{bouillabaisse:"French fish stew from Marseille",ratatouille:"Provençal vegetable dish",paella:"Spanish saffron rice dish",shakshuka:"Eggs poached in tomato sauce"}
};

/* ═══════════════════════════════════════════
   GAME STATE
═══════════════════════════════════════════ */
let state = {
  word: "",
  category: "technology",
  difficulty: "easy",
  guessed: new Set(),
  lives: 6,
  maxLives: 6,
  score: 0,
  best: parseInt(localStorage.getItem('lexicon_best')||'0'),
  streak: 0,
  hintsUsed: 0,
  gameActive: false,
  timerInterval: null,
  timeLeft: 0,
  maxTime: 0,
  muted: false,
  theme: 'dark',
};

const diffConfig = {
  easy:   {lives:8, time:120, pointsPerLetter:10, bonusTime:5},
  medium: {lives:6, time:90,  pointsPerLetter:20, bonusTime:10},
  hard:   {lives:4, time:60,  pointsPerLetter:35, bonusTime:20},
};

let scores = JSON.parse(localStorage.getItem('lexicon_scores')||'[]');
const categories = Object.keys(WORDS);
let selectedCat = 'all';

/* ═══════════════════════════════════════════
   AUDIO ENGINE (Web Audio API)
═══════════════════════════════════════════ */
let audioCtx;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type='sine', duration=0.15, vol=0.3){
  if(state.muted) return;
  try{
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration);
    osc.start(); osc.stop(ctx.currentTime+duration);
  }catch(e){}
}
const sounds = {
  correct(){[523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.2,0.3),i*80));},
  wrong(){playTone(200,'sawtooth',0.3,0.25);},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.3,0.4),i*120));},
  lose(){[400,300,200].forEach((f,i)=>setTimeout(()=>playTone(f,'triangle',0.4,0.3),i*150));},
  click(){playTone(800,'sine',0.05,0.1);},
  hint(){playTone(440,'sine',0.2,0.2);},
  timer(){playTone(1200,'square',0.05,0.05);}
};

/* ═══════════════════════════════════════════
   CONFETTI
═══════════════════════════════════════════ */
function launchConfetti(){
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const pieces = Array.from({length:120},()=>({
    x: Math.random()*innerWidth, y:-20,
    size: Math.random()*10+5,
    color:`hsl(${Math.random()*360},90%,60%)`,
    speed: Math.random()*4+2,
    ang: Math.random()*360,
    spin: (Math.random()-0.5)*4,
    wx: (Math.random()-0.5)*2
  }));
  let frame;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.y+=p.speed; p.ang+=p.spin; p.x+=p.wx;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang*Math.PI/180);
      ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size/2);
      ctx.restore();
    });
    if(pieces.some(p=>p.y<canvas.height+50)) frame=requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
  setTimeout(()=>{cancelAnimationFrame(frame);ctx.clearRect(0,0,canvas.width,canvas.height);},4000);
}

/* ═══════════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════════ */
function showToast(msg, type='', dur=2000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(type?' '+type:'');
  t.classList.add('show');
  clearTimeout(t._to);
  t._to=setTimeout(()=>t.classList.remove('show'),dur);
}

function toggleTheme(){
  sounds.click();
  state.theme = state.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',state.theme);
  document.querySelector('.icon-btn[onclick="toggleTheme()"]').textContent = state.theme==='dark'?'🌙':'☀️';
}

function toggleMute(){
  state.muted=!state.muted;
  document.getElementById('muteBtn').textContent=state.muted?'🔇':'🔊';
  showToast(state.muted?'Sound off':'Sound on');
}

/* ═══════════════════════════════════════════
   SETUP PILLS
═══════════════════════════════════════════ */
function initCatPills(){
  const wrap = document.getElementById('catPills');
  wrap.innerHTML='';
  const all = document.createElement('button');
  all.className='pill active'; all.textContent='All';
  all.onclick=()=>{sounds.click();selectedCat='all';setPillActive(all,wrap);};
  wrap.appendChild(all);
  categories.forEach(cat=>{
    const p=document.createElement('button');
    p.className='pill';
    p.textContent=cat.charAt(0).toUpperCase()+cat.slice(1);
    p.onclick=()=>{sounds.click();selectedCat=cat;setPillActive(p,wrap);};
    wrap.appendChild(p);
  });
}
function setPillActive(el,parent){
  parent.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}

function setDifficulty(d, el){
  sounds.click();
  state.difficulty=d;
  document.querySelectorAll('.pill[class*="diff-"]').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}

/* ═══════════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════════ */
const ROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
function buildKeyboard(){
  const kb=document.getElementById('keyboard');
  kb.innerHTML='';
  ROWS.forEach(row=>{
    const rowEl=document.createElement('div');
    rowEl.className='kb-row';
    [...row].forEach(l=>{
      const k=document.createElement('button');
      k.className='kb-key'; k.id='key-'+l.toLowerCase();
      k.textContent=l;
      k.onclick=()=>guess(l.toLowerCase());
      rowEl.appendChild(k);
    });
    kb.appendChild(rowEl);
  });
}

function updateKeyboard(){
  document.querySelectorAll('.kb-key').forEach(k=>{
    const l=k.textContent.toLowerCase();
    k.classList.remove('correct','wrong');
    k.disabled=false;
    if(state.guessed.has(l)){
      if(state.word.includes(l)) k.classList.add('correct');
      else k.classList.add('wrong');
      k.disabled=true;
    }
  });
}

/* ═══════════════════════════════════════════
   WORD DISPLAY
═══════════════════════════════════════════ */
function renderWord(reveal=false){
  const wd=document.getElementById('wordDisplay');
  wd.innerHTML='';
  [...state.word].forEach((ch,i)=>{
    if(ch===' '){
      const sp=document.createElement('div');
      sp.style.cssText='width:20px;display:inline-block;';
      wd.appendChild(sp); return;
    }
    const box=document.createElement('div');
    box.className='letter-box';
    const char=document.createElement('div');
    char.className='letter-char';
    const line=document.createElement('div');
    line.className='letter-line';
    const known = state.guessed.has(ch)||reveal;
    if(known){
      char.textContent=ch.toUpperCase();
      if(!reveal) char.classList.add('reveal');
      box.classList.add('active');
    } else {
      char.classList.add('blank');
      char.textContent='_';
    }
    box.appendChild(char); box.appendChild(line);
    wd.appendChild(box);
  });
}

/* ═══════════════════════════════════════════
   LIVES
═══════════════════════════════════════════ */
function renderLives(){
  const row=document.getElementById('livesRow');
  row.innerHTML='';
  for(let i=0;i<state.maxLives;i++){
    const h=document.createElement('div');
    h.className='heart'+(i>=state.lives?' lost':'');
    h.textContent='❤️';
    row.appendChild(h);
  }
}

/* ═══════════════════════════════════════════
   TIMER
═══════════════════════════════════════════ */
function startTimer(){
  clearInterval(state.timerInterval);
  const cfg=diffConfig[state.difficulty];
  state.timeLeft=cfg.time; state.maxTime=cfg.time;
  updateTimer();
  state.timerInterval=setInterval(()=>{
    if(!state.gameActive){clearInterval(state.timerInterval);return;}
    state.timeLeft--;
    if(state.timeLeft<=10) sounds.timer();
    updateTimer();
    if(state.timeLeft<=0) timeUp();
  },1000);
}

function updateTimer(){
  const pct=state.timeLeft/state.maxTime*100;
  const fill=document.getElementById('timerFill');
  const count=document.getElementById('timerCount');
  fill.style.width=pct+'%';
  fill.classList.toggle('warning',pct<30);
  count.textContent=state.timeLeft+'s';
  count.classList.toggle('pulse',state.timeLeft<=10&&state.gameActive);
}

function stopTimer(){
  clearInterval(state.timerInterval);
  document.getElementById('timerCount').classList.remove('pulse');
}

function timeUp(){
  stopTimer();
  state.gameActive=false;
  sounds.lose();
  endGame(false,'time');
}

/* ═══════════════════════════════════════════
   SCORING
═══════════════════════════════════════════ */
function calcPoints(correctLetters){
  const cfg=diffConfig[state.difficulty];
  let pts = correctLetters * cfg.pointsPerLetter;
  pts += state.timeLeft * cfg.bonusTime;
  pts += state.lives * 10;
  if(state.hintsUsed===0) pts+=50;
  pts = Math.round(pts * (1+state.streak*0.1));
  return Math.max(0,pts);
}

function updateScoreUI(){
  document.getElementById('scoreDisplay').textContent=state.score;
  document.getElementById('bestDisplay').textContent=state.best;
  document.getElementById('streakDisplay').textContent=state.streak+'🔥';
}

/* ═══════════════════════════════════════════
   GAME CORE
═══════════════════════════════════════════ */
function pickWord(){
  let pool = [];
  const cats = selectedCat==='all' ? categories : [selectedCat];
  cats.forEach(cat=>{
    const arr = WORDS[cat]?.[state.difficulty];
    if(arr) arr.forEach(w=>pool.push({word:w,cat}));
  });
  return pool[Math.floor(Math.random()*pool.length)];
}

function newGame(){
  sounds.click();
  stopTimer();
  const picked=pickWord();
  if(!picked){showToast('No words found!','error');return;}
  const cfg=diffConfig[state.difficulty];
  state.word=picked.word.toLowerCase();
  state.category=picked.cat;
  state.guessed=new Set();
  state.lives=cfg.lives; state.maxLives=cfg.lives;
  state.gameActive=true;
  state.hintsUsed=0;

  document.getElementById('catBadge').textContent=
    state.category.charAt(0).toUpperCase()+state.category.slice(1)+' — '+
    state.difficulty.charAt(0).toUpperCase()+state.difficulty.slice(1);
  document.getElementById('hintText').textContent='';

  renderWord();
  renderLives();
  updateKeyboard();
  buildKeyboard();
  startTimer();
  setActionBtns(true);
  closeOverlay();
}

function setActionBtns(enabled){
  document.getElementById('hintBtn').disabled=!enabled;
  document.getElementById('skipBtn').disabled=!enabled;
  document.getElementById('giveUpBtn').disabled=!enabled;
}

function guess(letter){
  if(!state.gameActive||state.guessed.has(letter)) return;
  sounds.click();
  state.guessed.add(letter);
  const inWord=state.word.includes(letter);
  if(inWord){
    sounds.correct();
    renderWord();
    showToast('✓ Correct!','success',1200);
    // check win
    const allGuessed=[...state.word].every(c=>c===' '||state.guessed.has(c));
    if(allGuessed) winGame();
  } else {
    sounds.wrong();
    state.lives--;
    renderLives();
    const wordEl=document.getElementById('wordDisplay');
    wordEl.classList.remove('shake');
    void wordEl.offsetWidth;
    wordEl.classList.add('shake');
    showToast('✗ Wrong!','error',1200);
    if(state.lives<=0) endGame(false,'lives');
  }
  updateKeyboard();
}

function winGame(){
  stopTimer();
  state.gameActive=false;
  const correct=[...new Set([...state.word].filter(c=>c!==' '))].length;
  const pts=calcPoints(correct);
  state.score+=pts;
  state.streak++;
  if(state.score>state.best){state.best=state.score;localStorage.setItem('lexicon_best',state.best);}
  updateScoreUI();
  saveScore(pts);
  sounds.win();
  launchConfetti();
  setTimeout(()=>showOverlay(true,pts),400);
}

function endGame(win, reason=''){
  stopTimer();
  state.gameActive=false;
  state.streak=0;
  updateScoreUI();
  renderWord(true);
  setActionBtns(false);
  sounds.lose();
  setTimeout(()=>showOverlay(false,0,reason),400);
}

function showOverlay(win, pts=0, reason=''){
  const ol=document.getElementById('overlay');
  document.getElementById('overlayEmoji').textContent=win?'🎉':'😢';
  const title=document.getElementById('overlayTitle');
  title.textContent=win?'YOU WON!':'GAME OVER';
  title.className='overlay-title '+(win?'win':'lose');
  document.getElementById('overlayWord').innerHTML=
    `The word was: <strong>${state.word.toUpperCase()}</strong>`;
  document.getElementById('overlayPoints').textContent=
    win?`+${pts} points`:(reason==='time'?'⏱ Time up!':'💀 No lives left!');
  ol.classList.add('show');
}

function closeOverlay(){document.getElementById('overlay').classList.remove('show');}

function giveUp(){
  if(!state.gameActive) return;
  sounds.click();
  state.streak=0;
  endGame(false,'gave up');
}

function skipWord(){
  if(!state.gameActive) return;
  sounds.click();
  state.streak=0;
  state.score=Math.max(0,state.score-100);
  updateScoreUI();
  showToast('Word skipped! –100 pts','error');
  newGame();
}

function useHint(){
  if(!state.gameActive||state.hintsUsed>=3) return;
  sounds.hint();
  // Reveal a random unguessed letter
  const unguessed=[...state.word].filter(c=>c!==' '&&!state.guessed.has(c));
  if(unguessed.length===0){showToast('All letters already shown!');return;}
  const letter=unguessed[Math.floor(Math.random()*unguessed.length)];
  state.guessed.add(letter);
  state.hintsUsed++;
  state.score=Math.max(0,state.score-50);
  updateScoreUI();
  renderWord();
  updateKeyboard();
  showToast(`💡 Hint: "${letter.toUpperCase()}" revealed`,'success');
  // Also show a text hint if available
  const h=HINTS[state.category]?.[state.word];
  if(h) document.getElementById('hintText').textContent='💬 '+h;
  if(state.hintsUsed>=3) document.getElementById('hintBtn').disabled=true;
  const allGuessed=[...state.word].every(c=>c===' '||state.guessed.has(c));
  if(allGuessed) winGame();
}

/* ═══════════════════════════════════════════
   LEADERBOARD
═══════════════════════════════════════════ */
function saveScore(pts){
  const entry={name:'You',pts,diff:state.difficulty,cat:state.category,time:Date.now()};
  scores.unshift(entry);
  scores=scores.slice(0,10);
  localStorage.setItem('lexicon_scores',JSON.stringify(scores));
  renderLeaderboard();
}

function renderLeaderboard(){
  const lb=document.getElementById('lbContent');
  if(!scores.length){lb.innerHTML='<div class="no-scores">No scores yet. Play a game!</div>';return;}
  lb.innerHTML=scores.map((s,i)=>{
    const rank=['gold','silver','bronze'][i]||'';
    return `<div class="lb-row">
      <div class="lb-rank ${rank}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
      <div class="lb-name">${s.name} <span class="lb-diff">(${s.diff})</span></div>
      <div class="lb-score">${s.pts}</div>
    </div>`;
  }).join('');
}

function showLeaderboard(){
  sounds.click();
  document.getElementById('leaderboardPanel').scrollIntoView({behavior:'smooth'});
}

/* ═══════════════════════════════════════════
   KEYBOARD LISTENER
═══════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(!state.gameActive) return;
  if(e.key.length===1&&e.key.match(/[a-z]/i)) guess(e.key.toLowerCase());
});

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
function init(){
  initCatPills();
  buildKeyboard();
  updateScoreUI();
  renderLives();
  renderLeaderboard();
  // initial timer display
  document.getElementById('timerFill').style.width='100%';
  document.getElementById('timerCount').textContent='--';
}

init();
</script>
